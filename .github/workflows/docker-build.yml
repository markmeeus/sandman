name: Build Multi-Arch Docker Image

on:
  push:
    branches: [gh-workflow]
    tags: ['v*']
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sandman
          tags: |
            # For version tags (v1.0.0), create version tags + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # For main branch (non-tag), create latest-beta
            type=raw,value=latest-beta,enable=${{ github.ref == 'refs/heads/gh-workflow' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sandman
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch image
        if: github.event_name != 'pull_request'
        run: |
          # Verify the appropriate tag based on trigger
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/sandman:latest
          else
            docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/sandman:latest-beta
          fi

